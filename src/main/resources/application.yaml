spring:
  application:
    name: test-exchange-service
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000

exchange-rate:
  api:
    base-url: https://v6.exchangerate-api.com/v6
    key: 3635bb7bf1393d87c4dd5155

server:
   port: ${PORT:8789}
#Abre http://localhost:8789/h2-console
